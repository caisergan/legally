name: Signing service

on:
  push:
    paths:
      - "signing-service/**"
      - "docs/signing/**"
      - "docs/tasks/EIMZA_BUILD_LEDGER.md"
      - ".github/workflows/signing-service.yml"
  pull_request:
    paths:
      - "signing-service/**"
      - "docs/signing/**"
      - "docs/tasks/EIMZA_BUILD_LEDGER.md"
      - ".github/workflows/signing-service.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: signing-service/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Fuzz smoke (Phase 1B parser/preflight/verify robustness)
        run: |
          go test ./third_party/eimza-go/pdf/ -run='^$' -fuzz='^FuzzParse$' -fuzztime=20s
          go test ./third_party/eimza-go/pdf/ -run='^$' -fuzz='^FuzzContainsName$' -fuzztime=10s
          go test ./third_party/eimza-go/pdf/ -run='^$' -fuzz='^FuzzFindDictionaryEnd$' -fuzztime=10s
          go test ./internal/pades/ -run='^$' -fuzz='^FuzzVerifyLocal$' -fuzztime=20s
          go test ./internal/pades/ -run='^$' -fuzz='^FuzzSignPreflight$' -fuzztime=20s
      - name: Install independent PAdES validators
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python3 -m venv /tmp/pyhanko-venv
          /tmp/pyhanko-venv/bin/pip install --quiet -r tools/requirements.txt
      - name: Two independent validator matrix + trust outcomes
        env:
          YARGI_PYHANKO_PYTHON: /tmp/pyhanko-venv/bin/python
        run: go test ./internal/validation/ -run 'Matrix|TrustOutcome' -v
      - name: Install SoftHSM (live end-to-end)
        run: sudo apt-get install -y softhsm2
      - name: Live SoftHSM end-to-end (test-only, stays QUARANTINED)
        env:
          YARGI_PYHANKO_PYTHON: /tmp/pyhanko-venv/bin/python
          CGO_ENABLED: "1"
        run: |
          module=$(find /usr/lib -name libsofthsm2.so | head -1)
          test -n "$module" || { echo "libsofthsm2.so not found" >&2; exit 1; }
          eval "$(SOFTHSM_MODULE="$module" ./scripts/provision-softhsm-test-token.sh "$RUNNER_TEMP/softhsm" | grep '^export')"
          go test -tags pkcs11 -run TestLiveSoftHSMEndToEnd -v -count=1 ./test/integration/
      - name: Enforce selected-fork dependency boundary
        run: |
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | sort -u)
          printf '%s\n' "$deps"
          if printf '%s\n' "$deps" | grep -v '^github.com/caisergan/legally/signing-service' | grep -q .; then
            exit 1
          fi
      - name: Enforce creation-policy exclusions
        run: |
          if grep -RInE --include='*.go' --exclude='*_test.go' 'crypto/md5|crypto/sha1|RSA_PSS|ECDSA|DSA|kamusm|timestamp|pkcs11|miekg' third_party/eimza-go; then
            exit 1
          fi
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Install CycloneDX generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Generate SBOM
        run: cyclonedx-gomod mod -json -output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: signing-service-sbom
          path: signing-service/sbom.cdx.json
