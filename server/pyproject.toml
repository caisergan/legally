[project]
name = "yargi-asistan-server"
version = "0.1.0"
description = "Yargı Asistan — legal research workspace backend (FastAPI + SQLite + yargi-mcp bridge)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "anthropic>=0.40.0",
    "fastmcp>=2.10.5",
    "httpx>=0.28.1",
    "yargi-mcp",
]

[tool.uv.sources]
yargi-mcp = { path = "../../yargi-mcp" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
